# STM32MP157 Linux device gateway example configuration
serial.device=/dev/ttySTM1
serial.baud=115200
serial.rs485=true

modbus.slave=1
command.timeout_ms=1200
command.retries=1

# The application can run with MQTT disabled for local UART verification.
mqtt.enabled=false
mqtt.host=127.0.0.1
mqtt.port=1883
mqtt.client_id=stm32mp157-gateway
mqtt.command_topic=device/demo/command
mqtt.state_topic=device/demo/state
mqtt.keepalive_s=30

